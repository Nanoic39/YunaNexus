server:
  port: 8000

spring:
  application:
    name: YunaNexus-Gateway
  cloud:
    nacos:
      discovery:
        enabled: true
        register-enabled: true
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://YunaNexus-AuthService
              predicates:
                - Path=/auth/**,/login/**,/register/**,/key/**,/oauth/**
            - id: file-avatar
              uri: lb://YunaNexus-FileService
              predicates:
                - Path=/file/avatar/**
            - id: file-service
              uri: lb://YunaNexus-FileService
              predicates:
                - Path=/file/**

yunanexus:
  web:
    jwt:
      secret: ${YUNANEXUS_AUTH_JWT_SECRET}
  gateway:
    shard:
      routes:
        - base-name: YunaNexus-UserService
          paths:
            - /user
            - /me
            - /internal/user
        - base-name: YunaNexus-FileService
          paths:
            - /file
          exclude-paths:
            - /file/avatar