spring:
  application:
    name: YunaNexus-Gateway
  profiles:
    active: @spring.profiles.active@
  webflux:
    multipart:
      max-in-memory-size: ${YUNAGATEWAY_MAX_IN_MEMORY_SIZE:20MB}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      eager: true
      filter:
        enabled: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${YUNAGATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${YUNAGATEWAY_RESPONSE_TIMEOUT:5s}
          routes:
            - id: auth-oauth
              uri: lb://YunaNexus-AuthService
              predicates:
                - Path=/oauth/**
            - id: auth-proxy
              uri: lb://YunaNexus-AuthService
              predicates:
                - Path=/auth/login,/auth/logout,/auth/refresh
              filters:
                - RewritePath=/auth/(?<segment>.*), /oauth/$\{segment}
            - id: auth-permission-proxy
              uri: lb://YunaNexus-AuthService
              predicates:
                - Path=/auth/permissionSnapshot
              filters:
                - RewritePath=/auth/permissionSnapshot, /permission/snapshot
            - id: auth-permission
              uri: lb://YunaNexus-AuthService
              predicates:
                - Path=/permission/**
            - id: user-public
              uri: lb://YunaNexus-UserService
              predicates:
                - Path=/register,/email-verify-send,/user-info,/me,/ping,/security/**
            - id: user-internal
              uri: lb://YunaNexus-UserService
              predicates:
                - Path=/internal/user/**
            - id: file-service
              uri: lb://YunaNexus-FileService
              predicates:
                - Path=/file/**

server:
  port: 8000
  max-http-request-header-size: ${YUNAGATEWAY_MAX_HEADER_SIZE:64KB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.alibaba.csp.sentinel: INFO

yunanexus:
  gateway:
    security:
      enabled: true
      auth-parse-uri: lb://YunaNexus-AuthService/oauth/parse
      auth-timeout: ${YUNAGATEWAY_AUTH_TIMEOUT_MS:3000ms}
      max-body-size: ${YUNAGATEWAY_MAX_BODY_SIZE:20MB}
      permit-paths:
        - /oauth/login
        - /oauth/refresh
        - /register
        - /email-verify-send
        - /ping
        - /security/rsa/public-key
        - /file/public/**
        - /file/share/**
        - /file/avatar/**
      ip-whitelist: ${YUNAGATEWAY_IP_WHITELIST:}
      ip-blacklist: ${YUNAGATEWAY_IP_BLACKLIST:}
      forward-user-context: true
    cors:
      allowed-origins:
        - ${YUNAGATEWAY_ALLOWED_ORIGIN:*}
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers:
        - "*"
      exposed-headers:
        - Authorization
        - Content-Disposition
      allow-credentials: false
      max-age: 3600
    sentinel:
      api-definitions:
        - api-name: auth-api
          patterns:
            - /oauth/**
            - /permission/**
        - api-name: user-api
          patterns:
            - /register
            - /email-verify-send
            - /me
            - /user-info
            - /security/**
        - api-name: file-api
          patterns:
            - /file/**
      flow-rules:
        - resource: auth-api
          count: ${YUNAGATEWAY_FLOW_AUTH_COUNT:50}
          interval-sec: 1
          burst: 10
        - resource: user-api
          count: ${YUNAGATEWAY_FLOW_USER_COUNT:120}
          interval-sec: 1
          burst: 20
        - resource: file-api
          count: ${YUNAGATEWAY_FLOW_FILE_COUNT:80}
          interval-sec: 1
          burst: 10
