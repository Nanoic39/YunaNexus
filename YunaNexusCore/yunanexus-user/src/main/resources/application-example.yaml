server:
  port: 8100

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yunanexus_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: <数据库账号>
    password: <数据库密码>
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: <username>
        password: <password>

yunanexus:
  web:
    jwt:
      secret: ${YUNANEXUS_AUTH_JWT_SECRET}

custom:
  time:
    time-zone: Asia/Shanghai
