server:
  port: 8300

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/yunanexus_file?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: <数据库账号>
    password: <数据库密码>
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

yunanexus:
  web:
    jwt:
      secret: ${YUNANEXUS_AUTH_JWT_SECRET}
  file:
    storage-path: ./storage
