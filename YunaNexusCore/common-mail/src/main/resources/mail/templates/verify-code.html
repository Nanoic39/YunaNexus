<!-- 验证码 模板 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>YunaNexus</title>
</head>
<body style="margin:0;padding:0;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6F8;padding:32px 16px">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.06)">
                <tr>
                    <td style="padding:32px 40px 0;background:#A0D8EF;background:linear-gradient(135deg,#A0D8EF,#7ec8e3)">
                        <h1 style="margin:0;font-size:22px;color:#fff;font-weight:600;letter-spacing:1px">YunaNexus</h1>
                        <p style="margin:8px 0 24px;font-size:14px;color:rgba(255,255,255,0.85)">邮箱验证</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px">
                        <p style="margin:0 0 24px;font-size:15px;color:#444;line-height:1.8">
                            您正在进行邮箱验证，请使用以下验证码完成操作：
                        </p>
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding:20px;background:#F5F6F8;border-radius:8px">
                                    <span style="font-family:'JetBrains Mono','SF Mono',monospace;font-size:30px;font-weight:700;color:#A0D8EF;letter-spacing:8px">{code}</span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:24px 0 0;font-size:13px;color:#999;line-height:1.6">
                            验证码 <strong>5 分钟</strong>内有效，请勿转发给他人。<br>
                            如果不是您本人操作，请忽略此邮件。
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px;background:#FAFAFA;border-top:1px solid #eee">
                        <p style="margin:0;font-size:12px;color:#bbb;text-align:center">
                            © {year} YunaNexus. 此邮件由系统自动发送，请勿回复。
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
