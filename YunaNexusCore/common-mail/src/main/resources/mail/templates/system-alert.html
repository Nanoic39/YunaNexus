<!-- 告警 模板 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>YunaNexus</title>
</head>
<body style="margin:0;padding:0;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6F8;padding:32px 16px">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.06)">
                <tr>
                    <td style="padding:32px 40px 0;background:{alert_color}">
                        <h1 style="margin:0;font-size:18px;color:#fff;font-weight:600">{alert_title}</h1>
                        <p style="margin:8px 0 24px;font-size:13px;color:rgba(255,255,255,0.85)">{alert_time}</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px">
                        {alert_content}
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px;background:#FAFAFA;border-top:1px solid #eee">
                        <p style="margin:0;font-size:12px;color:#bbb;text-align:center">
                            © {year} YunaNexus 系统监控
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
