<!-- 注册成功后欢迎 模板 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>YunaNexus</title>
</head>
<body style="margin:0;padding:0;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6F8;padding:32px 16px">
    <tr>
        <td align="center">
            <table width="480" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,0.06)">
                <tr>
                    <td style="padding:32px 40px 0;background:linear-gradient(135deg,#A0D8EF,#80FFC0)">
                        <h1 style="margin:0;font-size:22px;color:#fff;font-weight:600;letter-spacing:1px">欢迎加入 YunaNexus</h1>
                        <p style="margin:8px 0 24px;font-size:14px;color:rgba(255,255,255,0.85)">你的云端空间已就绪</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 40px">
                        <p style="margin:0 0 16px;font-size:15px;color:#444;line-height:1.8">
                            Hi <strong>{nickname}</strong>，
                        </p>
                        <p style="margin:0 0 24px;font-size:15px;color:#444;line-height:1.8">
                            恭喜你成功注册 YunaNexus 账户。你现在可以开始探索文件空间、个性化你的个人主页，以及使用更多精彩功能。
                        </p>
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding:12px 28px;background:#A0D8EF;border-radius:6px">
                                    <a href="{site_url}" style="font-size:15px;color:#fff;text-decoration:none;font-weight:600">开始使用</a>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 40px;background:#FAFAFA;border-top:1px solid #eee">
                        <p style="margin:0;font-size:12px;color:#bbb;text-align:center">
                            © {year} YunaNexus. 此邮件由系统自动发送，请勿回复。
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
