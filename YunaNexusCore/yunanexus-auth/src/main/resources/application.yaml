spring:
  application:
    name: YunaNexus-AuthService

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cc.nanoic.yunanexus.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

yunanexus:
  web:
    base-url: ${YUNANEXUS_WEB_URL:http://localhost:3000}
  auth:
    jwt:
      access-exp: 7200
      refresh-exp: 604800
    rsa:
      key-path: ./SecretKey
    aes:
      key-path: ./SecretKey
  oauth2:
    authorization-code-ttl: 300
    authorization-session-ttl: 600
    refresh-token-ttl: 2592000
    pkce-required: false
    issuer: https://yunanexus.example.com
