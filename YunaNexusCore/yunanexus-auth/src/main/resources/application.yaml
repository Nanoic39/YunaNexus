spring:
  application:
    name: YunaNexus-AuthService # 服务名称
  profiles:
    active: @spring.profiles.active@

# MyBatisPlus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cc.nanoic.yunanexus.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

server:
  port: 8200 # 端口

custom:
  time:
    time-zone: Asia/Shanghai