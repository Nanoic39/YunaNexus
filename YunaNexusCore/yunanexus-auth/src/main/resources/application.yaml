spring:
  application:
    name: YunaNexus-AuthService

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: cc.nanoic.yunanexus.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

yunanexus:
  auth:
    jwt:
      access-exp: 7200
      refresh-exp: 604800
    rsa:
      key-path: ./SecretKey
    aes:
      key-path: ./SecretKey
