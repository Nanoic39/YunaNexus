server:
  port: 8700
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: yunanexus-analytics
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    # 可选导入 Nacos 配置中心（数据 ID = yunanexus-analytics.yaml）；optional 保证 Nacos 不可用/未发布配置时不影响启动
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        metadata:
          management.port: ${management.server.port}
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        fail-fast: ${NACOS_FAIL_FAST:false}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      # 灰度标识：金丝雀实例带 YUNANEXUS_TRACK=canary，便于按 track 区分新旧版本指标
      track: ${YUNANEXUS_TRACK:stable}
  server:
    port: 8701

yunanexus:
  analytics:
    rocketmq:
      # 是否启用事件投递（本地无 MQ 时可关闭，事件仅记录日志、不投递）
      enabled: ${ANALYTICS_MQ_ENABLED:true}
      name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
      producer-group: ${ANALYTICS_MQ_PRODUCER_GROUP:analytics-producer-group}
      consumer-group: ${ANALYTICS_MQ_CONSUMER_GROUP:analytics-consumer-group}
      topic: ${ANALYTICS_MQ_TOPIC:analytics-event}
      tag: ${ANALYTICS_MQ_TAG:track}
      send-timeout-millis: ${ANALYTICS_MQ_SEND_TIMEOUT:3000}
    ingest:
      # 单次上报最大事件数，超过返回 80001
      max-batch-size: ${ANALYTICS_MAX_BATCH_SIZE:200}
      # 单事件 props 最大长度（字符），超过丢弃
      max-props-length: ${ANALYTICS_MAX_PROPS_LENGTH:4096}
      # 全局 QPS 上限（固定窗口限流），超过返回 80002；<=0 表示不限流
      max-qps: ${ANALYTICS_MAX_QPS:5000}
    clickhouse:
      # 是否启用 ClickHouse 写入（消费者使用，阶段 10.2 落地）
      enabled: ${ANALYTICS_CLICKHOUSE_ENABLED:false}
      url: ${ANALYTICS_CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/yunanexus_analytics}
      username: ${ANALYTICS_CLICKHOUSE_USERNAME:default}
      password: ${ANALYTICS_CLICKHOUSE_PASSWORD:}
      batch-size: ${ANALYTICS_CLICKHOUSE_BATCH_SIZE:1000}
