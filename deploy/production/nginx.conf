worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 21m;
  limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
  limit_req_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  resolver 127.0.0.11 ipv6=off valid=10s;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;
  server {
    listen 8080;
    server_name 103.39.66.135 yuna.nanoic.cc;
    root /srv/releases/current/user;
    set $gateway_upstream http://gateway:8010;
    location ~ /admin(?:/|$) { return 404; }
    location = /api/v1/auth/register { limit_req zone=login burst=2 nodelay; proxy_pass $gateway_upstream; }
    location = /api/v1/auth/password-reset/request { limit_req zone=login burst=2 nodelay; proxy_pass $gateway_upstream; }
    location = /api/v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass $gateway_upstream; }
    location /api/ { limit_req zone=api burst=30 nodelay; proxy_pass $gateway_upstream; }
    location ~ ^/(actuator|internal|nacos)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location = /mockServiceWorker.js { return 404; }
    location /assets/ { expires 7d; try_files $uri @user_previous_asset; }
    location @user_previous_asset {
      root /srv/releases/previous/user;
      expires 7d;
      try_files $uri =404;
    }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
  server {
    listen 9080;
    server_name 103.39.66.135 console.yuna.nanoic.cc;
    root /srv/releases/current/admin;
    set $gateway_upstream http://gateway:8010;
    location = /api/v1/auth/register { limit_req zone=login burst=2 nodelay; proxy_pass $gateway_upstream; }
    location = /api/v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass $gateway_upstream; }
    location = /api/v1/auth/password-reset/request { limit_req zone=login burst=2 nodelay; proxy_pass $gateway_upstream; }
    location /api/ { limit_req zone=api burst=30 nodelay; proxy_pass $gateway_upstream; }
    location ~ ^/(actuator|internal|nacos)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location = /mockServiceWorker.js { return 404; }
    location /assets/ { expires 7d; try_files $uri @admin_previous_asset; }
    location @admin_previous_asset {
      root /srv/releases/previous/admin;
      expires 7d;
      try_files $uri =404;
    }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
