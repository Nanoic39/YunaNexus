# YunaNexus · Docker Compose 联调专用 RocketMQ Broker 配置。
#
# 与仓库根 .rocketmq/broker.conf（宿主机本地启动用）的区别：
#   - store 路径使用容器内路径（由 docker volume 承载）；
#   - brokerIP1 指向 compose 服务名，保证容器网络内可路由。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
# 与 compose 中 namesrv 服务名保持一致
namesrvAddr = rocketmq-namesrv:9876
# 容器网络内 broker 地址（禁止使用宿主机 IP）
brokerIP1 = rocketmq-broker
