name: Production CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "22"
          cache: maven
      - name: Scan publication candidates
        run: python3 scripts/scan-publication.py
      - name: Test and build production
        run: mvn -B -ntp -Pprd clean verify
      - name: Package release
        run: python3 scripts/package-release.py backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-release
          path: release/
          retention-days: 2
  publish:
    if: github.event_name == 'push'
    needs: test-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backend-release
          path: release/
      - name: Publish validated deployment package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KIND: backend
        run: python3 scripts/publish-release.py
